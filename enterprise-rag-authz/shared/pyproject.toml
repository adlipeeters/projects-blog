[project]
name = "erag"
version = "0.1.0"
description = "Code the API and the Lambdas share: the access rules, the index schema, the query."
requires-python = ">=3.13,<3.14"
dependencies = ["boto3", "opensearch-py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erag"]
